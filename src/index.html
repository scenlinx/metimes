<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metimes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="widget" class="widget" aria-label="桌面时钟">
      <div class="panel-main">
        <div class="top-row">
          <div class="clock">
            <div class="time" id="time">
              <div class="time-card">
                <span class="time-card-ghost" aria-hidden="true">88</span>
                <span class="time-card-value" id="clock-hour">--</span>
              </div>
              <div class="time-colon" aria-hidden="true"><span></span><span></span></div>
              <div class="time-card">
                <span class="time-card-ghost" aria-hidden="true">88</span>
                <span class="time-card-value" id="clock-minute">--</span>
              </div>
              <div class="time-colon" aria-hidden="true"><span></span><span></span></div>
              <div class="time-card time-card-seconds" id="clock-seconds-card">
                <span class="time-card-ghost" aria-hidden="true">88</span>
                <span class="time-card-value" id="clock-seconds">--</span>
              </div>
            </div>
            <div class="date" id="date">正在同步时间…</div>
            <div class="lunar" id="lunar">
              <span id="lunar-date">农历加载中</span>
              <span class="lunar-tag" id="lunar-tag"></span>
            </div>
          </div>

          <aside class="countdowns">
            <ul class="countdown-list" id="countdown-list"></ul>
          </aside>
        </div>

        <div class="conditions">
          <div class="chip chip-action" id="weather-chip" title="点击设置城市">
            <span class="chip-label ellipsis" id="weather-label">定位中…</span>
            <span class="chip-line">
              <span class="chip-value" id="weather-temp">--°</span>
              <span class="chip-range" id="weather-temp-range"></span>
            </span>
          </div>
          <div class="chip">
            <span class="chip-label">湿度</span>
            <span class="chip-line">
              <span class="chip-value" id="weather-humidity">--%</span>
              <span class="chip-range" id="weather-humidity-range"></span>
            </span>
          </div>
          <div class="chip">
            <span class="chip-label ellipsis">空气质量<span class="aqi-level" id="aqi-level"></span></span>
            <span class="chip-line">
              <span class="chip-value" id="weather-aqi">--</span>
              <span class="chip-range" id="weather-aqi-range"></span>
            </span>
          </div>
        </div>
      </div>

      <div class="locator" id="countdown-panel" hidden>
        <div class="countdown-form-row">
          <input
            class="locator-input countdown-name-input"
            id="countdown-name"
            type="text"
            placeholder="名称，如 生日"
            autocomplete="off"
            spellcheck="false"
          />
          <input class="locator-input countdown-date" id="countdown-date" type="date" />
          <button class="locator-btn countdown-add" id="countdown-add">添加</button>
        </div>
        <div class="locator-results" id="countdown-manage-list"></div>
        <div class="locator-actions">
          <button class="locator-btn" id="countdown-close">完成</button>
        </div>
      </div>

      <div class="locator font-panel" id="font-panel" hidden>
        <div class="font-options" id="font-options">
          <button class="font-option" data-font="dseg" role="radio" aria-checked="true">
            <span>七段数码管</span>
            <span class="font-sample sample-dseg">12:34</span>
          </button>
          <button class="font-option" data-font="mono" role="radio" aria-checked="false">
            <span>JetBrains Mono</span>
            <span class="font-sample sample-mono">12:34</span>
          </button>
        </div>
        <div class="locator-actions">
          <button class="locator-btn" id="font-close">完成</button>
        </div>
      </div>

      <div class="locator" id="locator" hidden>
        <input
          class="locator-input"
          id="city-input"
          type="text"
          placeholder="输入城市名，如 杭州"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="locator-results" id="locator-results"></div>
        <div class="locator-actions">
          <button class="locator-btn" id="locate-auto">恢复自动定位</button>
          <button class="locator-btn" id="locate-cancel">取消</button>
        </div>
      </div>

    </main>

    <div class="menu" id="menu" role="menu" hidden>
      <button class="menu-item" id="toggle-top" role="menuitemcheckbox" aria-checked="true">
        <span class="check" aria-hidden="true">✓</span>
        <span>始终置顶</span>
      </button>
      <button class="menu-item" id="toggle-seconds" role="menuitemcheckbox" aria-checked="true">
        <span class="check" aria-hidden="true">✓</span>
        <span>显示秒数</span>
      </button>
      <button class="menu-item" id="toggle-lock" role="menuitemcheckbox" aria-checked="false">
        <span class="check" aria-hidden="true">✓</span>
        <span>锁定位置</span>
      </button>
      <button class="menu-item" id="set-font" role="menuitem">
        <span class="check" aria-hidden="true"></span>
        <span>时间字体…</span>
      </button>
      <button class="menu-item" id="set-city" role="menuitem">
        <span class="check" aria-hidden="true"></span>
        <span>设置城市…</span>
      </button>
      <button class="menu-item" id="set-countdowns" role="menuitem">
        <span class="check" aria-hidden="true"></span>
        <span>倒计时设置…</span>
      </button>
      <button class="menu-item" id="refresh-weather" role="menuitem">
        <span class="check" aria-hidden="true"></span>
        <span>刷新天气</span>
      </button>
      <div class="menu-sep" role="separator"></div>
      <button class="menu-item danger" id="quit" role="menuitem">退出挂件</button>
    </div>

    <script src="vendor/lunar.js"></script>
    <script src="main.js"></script>
  </body>
</html>
